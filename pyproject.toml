[project]
name = "payment-risk-workbench"
version = "0.1.0"
description = "Transaction fraud analysis and cost-based payment risk decisions."
authors = [{ name = "Tomas Ferrer" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "plotly>=6,<8",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "lightgbm (>=4.6,<5)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ipykernel = ">=6,<8"
nbformat = ">=5,<6"
seaborn = "^0.13.2"
matplotlib = "^3.11.2"
mlflow = "^3.17.1"
nbclient = "^0.11.0"
